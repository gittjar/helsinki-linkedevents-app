<section class="weather-container">
  <header class="weather-header">
    <h3 class="weather-title">
      <svg class="lucide-icon title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      24 tunnin sääennuste Helsinkiin
    </h3>
    <button class="weather-menu-btn" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen">
      <span class="menu-icon" [class.open]="isMenuOpen">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span>{{ isMenuOpen ? 'Piilota tuntitiedot' : 'Näytä tuntitiedot' }}</span>
    </button>
  </header>

  <section class="weather-accordion" *ngIf="isMenuOpen">
    <article class="hour-row" *ngFor="let forecast of forecastData; let i = index" [class.current]="forecast.hourNumber === currentTime.getHours() && forecast.isToday">
      <button class="hour-toggle" (click)="toggleHour(i)">
        <div class="hour-main">
          <img [src]="forecast.condition.icon" alt="{{ forecast.condition.text }}" class="hour-icon" [title]="forecast.condition.text">
          <div class="hour-texts">
            <strong>{{ getHourHeader(forecast) }}</strong>
            <span>{{ forecast.condition.text }}</span>
          </div>
        </div>
        <div class="hour-meta">
          <span class="hour-temp" [style.color]="getTemperatureColor(forecast.temp_c)">
            <svg class="lucide-icon mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 14.76V3.5a2 2 0 0 0-4 0v11.26a4 4 0 1 0 4 0z"></path>
            </svg>
            {{ forecast.temp_c }}°
          </span>
          <span class="hour-chevron" [class.open]="expandedHourIndex === i">▾</span>
        </div>
      </button>

      <div class="hour-details" *ngIf="expandedHourIndex === i">
        <div class="detail-grid">
          <div class="detail-item">
            <span class="label">Aika</span>
            <span class="value">
              <svg class="lucide-icon mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              {{ forecast.time | date: 'HH:mm' }}
            </span>
          </div>
          <div class="detail-item">
            <span class="label">Päivä</span>
            <span class="value">
              <svg class="lucide-icon mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              {{ getDayLabel(forecast) }}
            </span>
          </div>
          <div class="detail-item">
            <span class="label">Tuntuu kuin</span>
            <span class="value">{{ forecast.feelslike_c }}°</span>
          </div>
          <div class="detail-item">
            <span class="label">Kosteus</span>
            <span class="value">{{ forecast.humidity }}%</span>
          </div>
          <div class="detail-item">
            <span class="label">Tuuli</span>
            <span class="value">{{ forecast.wind_kph }} km/h {{ forecast.wind_dir }}</span>
          </div>
          <div class="detail-item">
            <span class="label">Säätila</span>
            <span class="value">{{ forecast.condition.text }}</span>
          </div>
        </div>
      </div>
    </article>
  </section>
</section>
