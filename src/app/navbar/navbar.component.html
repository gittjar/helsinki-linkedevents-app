<nav [ngClass]="{ 'sticky': isSticky }">
  <section class="upnavi">

    <button (click)="toggleMenu()" class="hamburger-menu" aria-label="Toggle menu">
      <svg *ngIf="!menuVisible" class="hamburger-icon" fill="none" stroke="currentColor" viewBox="0 0 32 32">
        <line x1="6" y1="10" x2="26" y2="10" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="6" y1="22" x2="26" y2="22" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <svg *ngIf="menuVisible" class="hamburger-icon" fill="none" stroke="currentColor" viewBox="0 0 32 32">
        <line x1="8" y1="8" x2="24" y2="24" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="24" y1="8" x2="8" y2="24" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>

    <h3 class="nav-brand">
      <a routerLink="/mainpage" (click)="toggleMenu(false)">
        Helsinki LinkedEvents
      </a>
    </h3>

    <article class="navlinks" *ngIf="menuVisible">
      <div class="nav-item">
        <a routerLink="/event" (click)="toggleMenu(false)">Events</a>
      </div>
      <div class="nav-item">
        <a routerLink="/place" (click)="toggleMenu(false)">Places</a>
      </div>
      <div class="nav-item">
        <a routerLink="/image" (click)="toggleMenu(false)">Images</a>
      </div>
      <div class="nav-item">
        <a routerLink="/" (click)="toggleMenu(false)">Information</a>
      </div>
    </article>

  </section>
</nav>
