<div class="hero-wrapper">
  <gallery
    [items]="images"
    [autoPlay]="true"
    [playerInterval]="3500"
    [thumb]="false"
    [imageSize]="'cover'"
  ></gallery>

  <div class="hero-overlay">
    <div class="hero-content">
      <span class="hero-label">Avoin data · Helsinki</span>
      <h1 class="hero-title">Helsinki<span class="accent">.</span></h1>
      <p class="hero-subtitle">Tapahtumat &middot; Paikat &middot; Kuvat</p>
      <div class="hero-actions">
        <a routerLink="/event" class="hero-btn primary">Selaa tapahtumia</a>
        <a routerLink="/place" class="hero-btn secondary">L&ouml;yd&auml; paikkoja</a>
      </div>
    </div>
  </div>
</div>

<section class="home-sections">
  <div class="section-header">
    <p class="section-kicker">Pikakäynnit</p>
    <h2>Suunnista helposti</h2>
  </div>

  <div class="quick-links">
    <a *ngFor="let item of quickLinks" [routerLink]="item.link" class="feature-card">
      <span class="feature-icon">{{ item.icon }}</span>
      <h3>{{ item.title }}</h3>
      <p>{{ item.description }}</p>
    </a>
  </div>
</section>

<section class="home-sections">
  <div class="section-header">
    <p class="section-kicker">Alueet</p>
    <h2>Valitse kaupunginosa</h2>
  </div>

  <div class="area-grid">
    <a *ngFor="let area of areaTiles" [routerLink]="['/place']" [queryParams]="{ division: area.name }" class="area-card">
      <div class="area-cover" [style.background-image]="'url(' + area.cover + ')'" aria-hidden="true"></div>
      <div class="area-overlay" aria-hidden="true"></div>

      <div class="area-content">
        <div class="area-topline">
          <span class="area-icon">
            <lucide-icon [img]="area.icon" [size]="18" [strokeWidth]="2.2"></lucide-icon>
          </span>
          <span class="area-tag">{{ area.tag }}</span>
        </div>

        <h3>{{ area.name }}</h3>

        <div class="area-stats">
          <div class="stat-item" *ngFor="let stat of area.stats">
            <span>{{ stat.label }}</span>
            <strong>{{ stat.value }}</strong>
          </div>
        </div>
      </div>
    </a>
  </div>
</section>
